<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首爾旅遊地圖 | Seoul Tour Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="static/css/style.css?v=40" />
    <link rel="stylesheet" href="static/css/search_module.css?v=40" />
</head>
<body>
    <div id="app">
        <!-- 頂部導航 -->
        <header class="top-bar">
            <div class="logo">
                <i class="fas fa-map-marked-alt"></i>
                <h1>首爾旅遊地圖</h1>
                <span class="subtitle">Seoul Tour Map for Beginners</span>
            </div>
            <!-- 手機版側邊欄開關 -->
            <button id="sidebar-toggle" class="btn-toggle sidebar-toggle-btn" title="顯示/隱藏側邊欄">
                <i class="fas fa-bars"></i> 景點
            </button>
            <!-- Burger Menu 按鈕（手機版） -->
            <button id="burger-menu-btn" class="btn-toggle burger-menu-btn" title="選單">
                <i class="fas fa-ellipsis-v"></i>
            </button>
            <!-- Burger Menu 下拉選單 -->
            <div class="burger-menu-dropdown" id="burger-dropdown">
                <div class="burger-menu-item toggle-item" id="burger-toggle-subway">
                    <span><i class="fas fa-subway"></i> 地鐵線</span>
                    <div class="toggle-switch"><i class="fas fa-toggle-off"></i></div>
                </div>
                <div class="burger-menu-item toggle-item" id="burger-toggle-traffic">
                    <span><i class="fas fa-clock"></i> 交通規劃</span>
                    <div class="toggle-switch"><i class="fas fa-toggle-off"></i></div>
                </div>
                <div class="burger-menu-item" id="burger-toggle-lang">
                    <span><i class="fas fa-globe"></i> English 地圖</span>
                </div>
                <div class="burger-menu-item" id="burger-locate-user">
                    <span><i class="fas fa-location-arrow"></i> 我的定位</span>
                </div>
                <div class="burger-menu-item" id="burger-reset-map">
                    <span><i class="fas fa-compress-arrows-alt"></i> 重置地圖</span>
                </div>
            </div>
            <div class="header-actions" id="desktop-actions">
                <button id="toggle-subway" class="btn-toggle" title="顯示/隱藏地鐵線">
                    <i class="fas fa-subway"></i> 地鐵線
                </button>
                <button id="toggle-traffic" class="btn-toggle" title="顯示/隱藏交通時間">
                    <i class="fas fa-clock"></i> 交通
                </button>
                <button id="reset-map" class="btn-toggle" title="重置地圖">
                    <i class="fas fa-compress-arrows-alt"></i> 重置
                </button>
                <button id="toggle-map-lang" class="btn-toggle" title="切換至英文地圖">
                    <i class="fas fa-globe"></i> English
                </button>
                <button id="locate-user" class="btn-toggle" title="定位我的位置">
                    <i class="fas fa-location-arrow"></i> 定位
                </button>
            </div>
        </header>

        <!-- 主體區域 -->
        <div class="main-container">
            <!-- 左側邊欄 -->
            <aside class="sidebar">
                <!-- 景點分類篩選 -->
                <div class="panel">
                    <h3><i class="fas fa-filter"></i> 景點分類</h3>
                    <div class="category-filters">
                        <button class="cat-btn active" data-category="all">
                            <i class="fas fa-globe"></i> 全部
                        </button>
                        <button class="cat-btn" data-category="歷史文化">
                            <i class="fas fa-landmark"></i> 歷史文化
                        </button>
                        <button class="cat-btn" data-category="地標觀景">
                            <i class="fas fa-binoculars"></i> 地標觀景
                        </button>
                        <button class="cat-btn" data-category="購物美食">
                            <i class="fas fa-shopping-bag"></i> 購物美食
                        </button>
                        <button class="cat-btn" data-category="夜生活文化">
                            <i class="fas fa-music"></i> 夜生活文化
                        </button>
                        <button class="cat-btn" data-category="娛樂">
                            <i class="fas fa-ticket-alt"></i> 娛樂
                        </button>
                        <button class="cat-btn" data-category="休閒">
                            <i class="fas fa-coffee"></i> 休閒
                        </button>
                        <button class="cat-btn" data-category="自然景觀">
                            <i class="fas fa-tree"></i> 自然景觀
                        </button>
                        <button class="cat-btn" data-category="願望s">
                            <i class="fas fa-heart"></i> 願望s
                        </button>
                    </div>
                </div>

                <!-- 景點列表 -->
                <div class="panel">
                    <h3><i class="fas fa-list"></i> 景點列表</h3>
                    <div id="attraction-list" class="attraction-list">
                        <!-- 動態生成 -->
                    </div>
                </div>

                <!-- 釘選位置 -->
                <div class="panel" id="pinned-panel">
                    <h3>
                        <i class="fas fa-thumbtack"></i> 釘選位置
                        <span id="pinned-count" class="pinned-badge">0</span>
                        <span id="pinned-loading" class="sync-loading hidden"><i class="fas fa-spinner fa-spin"></i></span>
                    </h3>
                    <div id="pinned-list" class="pinned-list">
                        <!-- 動態生成 -->
                    </div>
                </div>
            </aside>
            <!-- 侧边栏遮罩 -->
            <div class="sidebar-overlay" id="sidebar-overlay"></div>

            <!-- 手機側邊欄開關按鈕 -->

            <!-- 地圖區域 -->
            <main class="map-area">
                <div id="map"></div>
                
                <!-- 地圖圖例 -->
                <div class="map-legend">
                    <h4>圖例</h4>
                    <div class="legend-item"><span class="dot history"></span> 歷史文化</div>
                    <div class="legend-item"><span class="dot landmark"></span> 地標觀景</div>
                    <div class="legend-item"><span class="dot shopping"></span> 購物美食</div>
                    <div class="legend-item"><span class="dot nightlife"></span> 夜生活</div>
                    <div class="legend-item"><span class="dot entertainment"></span> 娛樂</div>
                    <div class="legend-item"><span class="dot leisure"></span> 休閒</div>
                    <div class="legend-item"><span class="dot nature"></span> 自然景觀</div>
                </div>

                <!-- 路線規劃面板 -->
                <div id="route-panel" class="route-panel hidden">
                    <h3><i class="fas fa-route"></i> 路線規劃</h3>
                    <div class="route-inputs">
                        <div class="route-field">
                            <label><i class="fas fa-map-marker-alt text-green"></i> 起點</label>
                            <select id="route-start">
                                <option value="">選擇起點...</option>
                            </select>
                        </div>
                        <div class="route-field">
                            <label><i class="fas fa-flag-checkered text-red"></i> 終點</label>
                            <select id="route-end">
                                <option value="">選擇終點...</option>
                            </select>
                        </div>
                        <button id="calculate-route" class="btn-primary">
                            <i class="fas fa-search"></i> 查詢交通
                        </button>
                    </div>
                    <div id="route-result" class="route-result"></div>
                </div>
            </main>
        </div>

        <!-- AI 對話框 -->
        <div id="ai-chat" class="ai-chat collapsed">
            <div class="chat-header" onclick="toggleChat()">
                <i class="fas fa-robot"></i>
                <span class="chat-title" data-i18n="chat_title" title="AI 旅遊助手">AI 旅遊助手</span>
                <span id="system-status" class="status-indicator status-checking" title="正在檢查系統狀態..."><i class="fas fa-circle"></i></span>
                <i class="fas fa-expand resize-icon" id="resize-chat-icon" onclick="toggleChatHeight(event)" title="放大對話框"></i>
                <i class="fas fa-chevron-down toggle-icon"></i>
            </div>
            <div id="system-status-bar" class="status-bar hidden">
                <div id="status-ai" class="status-item"><i class="fas fa-brain"></i> <span>AI：檢查中...</span></div>
                <div id="status-hermes" class="status-item"><i class="fas fa-search"></i> <span>搜索：檢查中...</span></div>
            </div>
            <div class="chat-body">
                <div id="chat-messages" class="chat-messages">
                    <div class="message bot">
                        <div class="avatar"><i class="fas fa-robot"></i></div>
                        <div class="bubble">
                            你好！我係你嘅首爾旅遊 AI 助手 🎌<br>
                            我可以幫你：<br>
                            • 查詢景點資訊同開放時間<br>
                            • 解答交通路線問題<br>
                            • 推薦行程規劃<br>
                            • 解答韓國旅遊常見問題<br><br>
                            💡 **實用指令：**<br>
                            輸入 `/transit` 獲取地圖中心附近嘅實時巴士/地鐵資訊！<br><br>
                            有咩想知，隨時問我！
                        </div>
                    </div>
                </div>
                <div class="chat-input-area">
                    <input type="file" id="image-input" accept="image/*" style="display:none" onchange="handleImageUpload(event)">
                    <button id="upload-image-btn" class="upload-btn" onclick="document.getElementById('image-input').click()" title="上傳圖片識別地點">
                        <i class="fas fa-camera"></i>
                    </button>
                    <input type="text" id="chat-input" placeholder="問我關於首爾旅遊嘅問題...（或上傳圖片識別地點）" />
                    <button id="send-btn" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div id="image-preview" class="image-preview hidden"></div>
            </div>
        </div>
    </div>

    <!-- 手機版底部景點列表面板 (Bottom Sheet) -->
    <div id="mobile-location-panel" class="mobile-location-panel">
        <div class="mobile-panel-drag-handle" id="mobile-panel-drag-handle">
            <div class="drag-indicator"></div>
            <div class="mobile-panel-header">
                <span class="mobile-panel-title">📍 景點列表</span>
                <span class="mobile-panel-count" id="mobile-panel-count"></span>
            </div>
        </div>
        <div class="mobile-panel-tabs" id="mobile-panel-tabs">
            <button class="mobile-tab active" data-category="all">全部</button>
            <button class="mobile-tab" data-category="歷史文化">🏯 歷史</button>
            <button class="mobile-tab" data-category="地標觀景">🗼 觀景</button>
            <button class="mobile-tab" data-category="購物美食">🍜 美食</button>
            <button class="mobile-tab" data-category="夜生活文化">🎶 夜生活</button>
            <button class="mobile-tab" data-category="娛樂">🎭 娛樂</button>
            <button class="mobile-tab" data-category="休閒">☕ 休閒</button>
            <button class="mobile-tab" data-category="自然景觀">🌿 自然</button>
            <button class="mobile-tab" data-category="願望s">❤️ 願望s</button>
        </div>
        <div class="mobile-panel-list" id="mobile-panel-list">
            <!-- 動態生成 -->
        </div>
    </div>

    <!-- 景點詳情彈窗 -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">
                <i class="fas fa-times"></i>
            </button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="static/js/app.js?v=40"></script>
    <script src="static/js/search_module.js?v=40"></script>
</body>
</html>
